[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-log"
version = "0.1.0"
description = "Workspace-scoped logging platform built with FastAPI and PostgreSQL"
readme = "README.md"
authors = [{name = "Orbital"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.27",
    "SQLAlchemy>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
    "anyio>=4.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "anyio>=4.3"
]

[project.scripts]
orbitallog-benchmark = "scripts.benchmark:cli"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
