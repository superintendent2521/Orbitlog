<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}" />
</head>
<body>
<header>
    <h1>{{ title }}</h1>
    <p class="tagline">Capture backend activity with structured, searchable logs.</p>
</header>

<main>
    <section class="card">
        <h2>Log a New Operation</h2>
        <form id="log-form">
            <div class="grid">
                <label>
                    <span>Key *</span>
                    <input name="key" type="text" required placeholder="e.g. auth.login" />
                </label>
                <label>
                    <span>Name *</span>
                    <input name="name" type="text" required placeholder="e.g. User login" />
                </label>
                <label>
                    <span>Duration (ms)</span>
                    <input name="duration_ms" type="number" min="0" placeholder="optional" />
                </label>
                <label>
                    <span>Observed At</span>
                    <input name="observed_at" type="datetime-local" />
                </label>
            </div>
            <label>
                <span>Text</span>
                <textarea name="text" rows="3" placeholder="Summary or notes"></textarea>
            </label>
            <label>
                <span>Payload (JSON)</span>
                <textarea name="payload" rows="4" placeholder='{"query": "select * from users", "time": "1592 ms"}'></textarea>
            </label>
            <button type="submit">Submit Log</button>
            <p class="form-status" id="form-status"></p>
        </form>
    </section>

    <section class="card">
        <header class="list-header">
            <h2>Recent Logs</h2>
            <div class="filters">
                <input id="filter-key" type="text" placeholder="Filter by key" />
                <input id="filter-name" type="text" placeholder="Filter by name" />
                <button id="refresh-button" type="button">Refresh</button>
            </div>
        </header>
        <div class="table-wrapper">
            <table id="logs-table">
                <thead>
                <tr>
                    <th>Created</th>
                    <th>Key</th>
                    <th>Name</th>
                    <th>Text</th>
                    <th>Duration</th>
                    <th>Payload</th>
                </tr>
                </thead>
                <tbody id="logs-body">
                <tr>
                    <td colspan="6" class="placeholder">No data yet</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<template id="row-template">
    <tr>
        <td class="cell-created"></td>
        <td class="cell-key"></td>
        <td class="cell-name"></td>
        <td class="cell-text"></td>
        <td class="cell-duration"></td>
        <td class="cell-payload"></td>
    </tr>
</template>

<script>
const form = document.getElementById("log-form");
const formStatus = document.getElementById("form-status");
const logsBody = document.getElementById("logs-body");
const rowTemplate = document.getElementById("row-template");
const filterKeyInput = document.getElementById("filter-key");
const filterNameInput = document.getElementById("filter-name");
const refreshButton = document.getElementById("refresh-button");

function showStatus(message, type = "info") {
    formStatus.textContent = message;
    formStatus.className = `form-status ${type}`;
}

function parsePayload(raw) {
    if (!raw) return null;
    try {
        return JSON.parse(raw);
    } catch (err) {
        throw new Error("Payload must be valid JSON");
    }
}

function formatJSON(value) {
    if (!value) return "";
    return JSON.stringify(value, null, 2);
}

function formatTimestamp(value) {
    if (!value) return "";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) {
        return value;
    }
    return date.toLocaleString();
}

function renderRows(items) {
    logsBody.innerHTML = "";
    if (!items.length) {
        const row = document.createElement("tr");
        row.innerHTML = '<td colspan="6" class="placeholder">No matching entries</td>';
        logsBody.appendChild(row);
        return;
    }

    for (const item of items) {
        const row = rowTemplate.content.firstElementChild.cloneNode(true);
        row.querySelector(".cell-created").textContent = formatTimestamp(item.created_at);
        row.querySelector(".cell-key").textContent = item.key;
        row.querySelector(".cell-name").textContent = item.name;
        row.querySelector(".cell-text").textContent = item.text || "";
        row.querySelector(".cell-duration").textContent = item.duration_ms != null ? `${item.duration_ms} ms` : "";
        const payloadCell = row.querySelector(".cell-payload");
        payloadCell.textContent = "";
        if (item.payload) {
            const pre = document.createElement("pre");
            pre.textContent = formatJSON(item.payload);
            payloadCell.appendChild(pre);
        }
        logsBody.appendChild(row);
    }
}

async function fetchLogs() {
    const params = new URLSearchParams();
    const key = filterKeyInput.value.trim();
    const name = filterNameInput.value.trim();
    if (key) params.set("key", key);
    if (name) params.set("name", name);

    const response = await fetch(`/api/logs?${params.toString()}`);
    if (!response.ok) {
        throw new Error("Unable to load logs");
    }
    return response.json();
}

async function submitForm(event) {
    event.preventDefault();
    showStatus("Submitting…");

    const formData = new FormData(form);
    let payload = null;
    try {
        payload = parsePayload(formData.get("payload"));
    } catch (err) {
        showStatus(err.message, "error");
        return;
    }

    const body = {
        key: formData.get("key"),
        name: formData.get("name"),
        text: formData.get("text") || null,
        payload,
        duration_ms: formData.get("duration_ms") ? Number(formData.get("duration_ms")) : null,
        observed_at: formData.get("observed_at") || null,
    };

    const response = await fetch("/api/logs", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body),
    });

    if (!response.ok) {
        const {detail} = await response.json();
        showStatus(detail || "Failed to save log", "error");
        return;
    }

    form.reset();
    showStatus("Log saved", "success");
    await refreshLogs();
}

async function refreshLogs() {
    try {
        const logs = await fetchLogs();
        renderRows(logs);
    } catch (err) {
        logsBody.innerHTML = '<tr><td colspan="6" class="placeholder error">Failed to load logs</td></tr>';
        console.error(err);
    }
}

form.addEventListener("submit", submitForm);
filterKeyInput.addEventListener("change", refreshLogs);
filterNameInput.addEventListener("change", refreshLogs);
refreshButton.addEventListener("click", refreshLogs);

refreshLogs();
</script>
</body>
</html>
